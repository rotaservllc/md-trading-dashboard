name: crypto-tests
# Executor replay/chaos tests against a fake OKX. Runs on every push touching the crypto folder. No secrets, no network orders.
on:
  push:
    paths: ['crypto/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 crypto/tests/test_executor_chaos.py
