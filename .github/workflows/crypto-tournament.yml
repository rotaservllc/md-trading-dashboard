name: crypto-tournament
# Weekly re-test of every crypto lane config against fresh Yahoo data, plus live paper-lane scoring. Read-only on markets.
on:
  schedule:
    - cron: '20 5 * * 0'   # Sundays 05:20 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: crypto-paper
jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 crypto/research/tournament_backtest.py
      - name: commit report
        run: |
          git config user.name crypto-bot && git config user.email crypto-bot@users.noreply.github.com
          git add crypto/research/latest_tournament.md crypto/research/data/*.csv
          git diff --cached --quiet || (git commit -m "crypto: weekly tournament re-test $(date -u +%F)" && git pull --rebase && git push)
